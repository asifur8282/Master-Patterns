<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Master Patterns Vibrant Brand Gradient (Cyan to Indigo to Purple) -->
    <linearGradient id="mp-brand-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="48%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Top Ambient Specular Gloss -->
    <linearGradient id="mp-specular" x1="32" y1="0" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glass Inset Rim Highlight -->
    <linearGradient id="mp-rim-glow" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Vector Layers Depth -->
    <filter id="mp-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#090d16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Smooth 16px Corner Radius -->
  <rect width="64" height="64" rx="16" fill="url(#mp-brand-grad)"/>

  <!-- Top Ambient Glass Sheen -->
  <rect width="64" height="64" rx="16" fill="url(#mp-specular)"/>

  <!-- Inset Border Rim Highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#mp-rim-glow)" stroke-width="1.5" fill="none"/>

  <!-- Master Patterns Iconic 3-Tier Layered CS Geometry -->
  <g filter="url(#mp-drop)">
    <!-- Top Isometric Diamond (Frosted Glass Core) -->
    <polygon points="32 13 50.5 22.5 32 32 13.5 22.5"
      fill="#ffffff"
      fill-opacity="0.22"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Middle Isometric Chevron Layer -->
    <path d="M13.5 32.5L32 42L50.5 32.5"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- Base Isometric Chevron Layer -->
    <path d="M13.5 42.5L32 52L50.5 42.5"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>
</svg>
